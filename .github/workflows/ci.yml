# Every push and pull request: lint, typecheck, unit tests, the content check, and a production build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Content check (design bibles, vault)
        run: npm run -s design:check
      - name: Parts match the vault
        run: npm run -s parts:build -- --check
      - name: Build
        run: npm run build
